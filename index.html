<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="color-scheme" content="light dark">
<title>OKR Todo - 目标与待办管理</title>
<style>
:root {
  --c-primary: #6366f1;
  --c-primary-light: #818cf8;
  --c-primary-bg: #eef2ff;
  --c-bg: #f8fafc;
  --c-surface: #ffffff;
  --c-text: #1e293b;
  --c-text-2: #64748b;
  --c-text-3: #94a3b8;
  --c-border: #e2e8f0;
  --c-border-2: #f1f5f9;
  --c-success: #10b981;
  --c-success-bg: #ecfdf5;
  --c-warning: #f59e0b;
  --c-warning-bg: #fffbeb;
  --c-danger: #ef4444;
  --c-danger-bg: #fef2f2;
  --c-ai: #8b5cf6;
  --c-ai-bg: #f5f3ff;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --sh-sm: 0 1px 2px rgba(0,0,0,.05);
  --sh-md: 0 4px 6px rgba(0,0,0,.07);
  --sh-lg: 0 10px 15px rgba(0,0,0,.1);
  --backdrop: rgba(0,0,0,.4);
}

[data-theme="dark"] {
  --c-primary: #818cf8;
  --c-primary-light: #a5b4fc;
  --c-primary-bg: #1e1b4b;
  --c-bg: #0f172a;
  --c-surface: #1e293b;
  --c-text: #e2e8f0;
  --c-text-2: #94a3b8;
  --c-text-3: #64748b;
  --c-border: #334155;
  --c-border-2: #1e293b;
  --c-success: #34d399;
  --c-success-bg: #052e2b;
  --c-warning: #fbbf24;
  --c-warning-bg: #422006;
  --c-danger: #f87171;
  --c-danger-bg: #450a0a;
  --c-ai: #a78bfa;
  --c-ai-bg: #2e1065;
  --sh-sm: 0 1px 2px rgba(0,0,0,.3);
  --sh-md: 0 4px 6px rgba(0,0,0,.35);
  --sh-lg: 0 10px 15px rgba(0,0,0,.45);
  --backdrop: rgba(0,0,0,.65);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}


/* ===== Notes Board ===== */
.notes-toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.notes-search {
  flex: 1;
  min-width: 200px;
  padding: 8px 14px;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  background: var(--c-surface);
  color: var(--c-text);
  font-size: 14px;
  outline: none;
  transition: border-color .15s;
}
.notes-search:focus { border-color: var(--c-primary-light); }
.notes-filter-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.notes-filter-btn {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--c-border);
  background: var(--c-surface);
  color: var(--c-text-2);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.notes-filter-btn:hover { border-color: var(--c-primary-light); }
.notes-filter-btn.active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.note-card {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  padding: 16px;
  transition: all .2s;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.note-card:hover { box-shadow: var(--sh-md); transform: translateY(-2px); }
.note-card.pinned { border-color: var(--c-warning); border-width: 2px; }
.note-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.note-type-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
  white-space: nowrap;
}
.note-type-badge.kr { background: var(--c-primary-bg); color: var(--c-primary); }
.note-type-badge.todo { background: var(--c-success-bg); color: var(--c-success); }
.note-type-badge.flash { background: var(--c-ai-bg); color: var(--c-ai); }
.note-pin-btn {
  cursor: pointer;
  font-size: 14px;
  opacity: 0.4;
  transition: opacity .15s;
}
.note-pin-btn:hover { opacity: 1; }
.note-pin-btn.pinned { opacity: 1; color: var(--c-warning); }
.note-content {
  font-size: 14px;
  line-height: 1.6;
  color: var(--c-text);
  white-space: pre-wrap;
  word-break: break-word;
  flex: 1;
}
.note-source {
  font-size: 12px;
  color: var(--c-text-3);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.note-source-link {
  color: var(--c-primary);
  cursor: pointer;
  text-decoration: none;
}
.note-source-link:hover { text-decoration: underline; }
.note-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.note-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--c-border-2);
  color: var(--c-text-2);
}
.note-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--c-text-3);
}
.note-empty-icon { font-size: 48px; margin-bottom: 12px; }

/* ===== Layout ===== */
#app { display: flex; min-height: 100vh; }

.sidebar {
  width: 220px;
  background: var(--c-surface);
  border-right: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform .3s;
}

.sidebar-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--c-border-2);
}

.sidebar-header h1 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--c-primary), var(--c-ai));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-header .ver { font-size: 11px; color: var(--c-text-3); margin-top: 2px; }

.nav { flex: 1; padding: 12px 8px; overflow-y: auto; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  cursor: pointer;
  color: var(--c-text-2);
  font-size: 14px;
  font-weight: 500;
  transition: all .15s;
  margin-bottom: 2px;
  user-select: none;
}

.nav-item:hover { background: var(--c-border-2); color: var(--c-text); }
.nav-item.active { background: var(--c-primary-bg); color: var(--c-primary); }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.nav-item .shortcut { margin-left:auto; font-size:10px; color:var(--c-text-3); opacity:.7; }
.nav-item .badge {
  margin-left: auto;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--c-ai-bg);
  color: var(--c-ai);
  font-weight: 600;
}

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--c-border-2);
  font-size: 11px;
  color: var(--c-text-3);
}

.main {
  flex: 1;
  margin-left: 220px;
  padding: 0;
  min-height: 100vh;
}

.page { display: none; padding: 24px 32px; max-width: 1400px; animation: fadeIn .2s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 12px;
  flex-wrap: wrap;
}
.page-title { font-size: 22px; font-weight: 700; }
.page-subtitle { font-size: 13px; color: var(--c-text-2); margin-top: 2px; }
.page-header-actions { display:flex; gap:8px; align-items:center; }

/* Theme toggle */
.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  background: var(--c-surface);
  cursor: pointer;
  font-size: 16px;
  color: var(--c-text-2);
  transition: all .15s;
}
.theme-toggle:hover { background: var(--c-bg); color: var(--c-text); }

/* ===== Domain Tabs ===== */
.domain-tabs {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}
.domain-tab {
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  cursor: pointer;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
  color: var(--c-text-2);
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.domain-tab:hover { border-color: var(--c-primary-light); }
.domain-tab.active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
.domain-tab.add { border-style: dashed; color: var(--c-text-3); }
.domain-edit-btn {
  font-size: 11px;
  opacity: 0;
  transition: opacity .15s;
  margin-left: 2px;
}
.domain-tab:hover .domain-edit-btn { opacity: .7; }
.domain-tab .domain-edit-btn:hover { opacity: 1; transform: scale(1.2); }
.domain-del-btn {
  font-size: 11px;
  opacity: 0;
  transition: opacity .15s;
  margin-left: 2px;
}
.domain-tab:hover .domain-del-btn { opacity: .7; }
.domain-tab .domain-del-btn:hover { opacity: 1; color: var(--c-danger); transform: scale(1.2); }

/* ===== Cards ===== */
.card {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-sm);
  border: 1px solid var(--c-border-2);
  overflow: hidden;
  transition: box-shadow .2s, transform .2s;
}
.card:hover { box-shadow: var(--sh-md); }
.card-body { padding: 16px; }

/* KR Card Grid */
.kr-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kr-card {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  padding: 16px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.kr-card:hover { box-shadow: var(--sh-md); transform: translateY(-2px); }
.kr-card .kr-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.kr-card .kr-name { font-size: 15px; font-weight: 600; }
.kr-card .kr-type-tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
.kr-card .kr-type-tag.project { background: var(--c-primary-bg); color: var(--c-primary); }
.kr-card .kr-type-tag.habit { background: var(--c-success-bg); color: var(--c-success); }
.kr-card .kr-pri { font-size: 11px; padding: 2px 8px; border-radius: var(--r-sm); font-weight: 600; }

.pri-P0 { background: var(--c-danger-bg); color: var(--c-danger); }
.pri-P1 { background: var(--c-warning-bg); color: var(--c-warning); }
.pri-P2 { background: var(--c-primary-bg); color: var(--c-primary); }
.pri-P3 { background: var(--c-border-2); color: var(--c-text-2); }

/* Progress bar */
.progress-bar { height: 6px; background: var(--c-border-2); border-radius: 999px; overflow: hidden; margin: 10px 0; }
.progress-fill { height: 100%; background: var(--c-primary); border-radius: 999px; transition: width .3s; }

/* Habit heatmap strip */
.heatmap {
  display: flex;
  gap: 3px;
  margin: 10px 0;
}
.heatmap .day {
  width: 28px; height: 28px;
  border-radius: var(--r-sm);
  background: var(--c-border-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  color: var(--c-text-3);
}
.heatmap .day.checked { background: var(--c-success); color: #fff; }
.heatmap .day.today { border: 2px solid var(--c-primary); }
.heatmap .day.future { background: var(--c-border-2); opacity: .4; }

.kr-card .kr-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--c-text-3); flex-wrap: wrap; }
.kr-card .kr-next { font-size: 12px; color: var(--c-text-2); margin-top: 8px; padding: 6px 8px; background: var(--c-border-2); border-radius: var(--r-sm); }

/* KR add card */
.kr-card-add {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 140px;
  border: 2px dashed var(--c-border);
  background: transparent;
  box-shadow: none;
  color: var(--c-text-3);
  font-size: 14px;
  cursor: pointer;
  border-radius: var(--r-lg);
  transition: all .15s;
}
.kr-card-add:hover { border-color: var(--c-primary-light); color: var(--c-primary); background: var(--c-primary-bg); }

/* ===== Weekly Todo Overview ===== */
.weekly-overview {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  padding: 20px;
  margin-bottom: 24px;
}
.weekly-overview h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.weekly-overview h3 .count { font-size: 12px; color: var(--c-text-3); font-weight: 400; }
.todo-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--c-border-2);
}
.todo-row:last-child { border-bottom: none; }
.todo-row.dragging { opacity: 0.4; }
.todo-row.drag-over { border-top: 2px solid var(--c-primary); }
.domain-tab.dragging { opacity: 0.4; }
.domain-tab.drag-over { border-top: 2px solid var(--c-primary); }
.kr-card.dragging { opacity: 0.4; }
.kr-card.drag-over { border-top: 2px solid var(--c-primary); }
.ki-list-item.dragging { opacity: 0.4; }
.ki-list-item.drag-over { border-top: 2px solid var(--c-primary); }
.todo-drag-handle { cursor: grab; color: var(--c-text-3); opacity: 0.4; padding: 4px 2px; font-size: 14px; }
.todo-drag-handle:hover { opacity: 1; }
.todo-check {
  width: 20px; height: 20px;
  border: 2px solid var(--c-border);
  border-radius: 5px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.todo-check:hover { border-color: var(--c-primary); }
.todo-check.done { background: var(--c-success); border-color: var(--c-success); color: #fff; }
.todo-check.done::after { content: '✓'; font-size: 12px; }
.todo-info { flex: 1; min-width: 0; }
.todo-title { font-size: 14px; font-weight: 500; word-break: break-word; }
.todo-title.done { text-decoration: line-through; color: var(--c-text-3); }
.todo-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 11px; color: var(--c-text-3); margin-top: 2px; }
.todo-ddl { color: var(--c-danger); font-weight: 500; }
.todo-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.todo-row:hover .todo-actions { opacity: 1; }
.todo-action-btn {
  width: 28px; height: 28px;
  border: none; background: var(--c-border-2);
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 12px;
  color: var(--c-text-2);
  display: flex; align-items: center; justify-content: center;
}
.todo-action-btn:hover { background: var(--c-border); }
.todo-row.highlight { background: var(--c-primary-bg); border-radius: var(--r-sm); }

/* ===== Quick Notes ===== */
.quick-notes {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  padding: 16px;
}
.quick-notes h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.qn-input {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.qn-input input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  font-size: 13px;
  outline: none;
  transition: border-color .15s;
  background: var(--c-surface);
  color: var(--c-text);
}
.qn-input input:focus { border-color: var(--c-primary); }
.qn-item {
  padding: 8px 10px;
  background: var(--c-bg);
  border-radius: var(--r-md);
  margin-bottom: 6px;
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.qn-item .qn-text { flex: 1; word-break: break-word; }
.qn-item .qn-time { font-size: 10px; color: var(--c-text-3); flex-shrink: 0; }
.qn-item .qn-del { color: var(--c-text-3); cursor: pointer; font-size: 12px; }
.qn-item .qn-del:hover { color: var(--c-danger); }

.habit-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--c-success-bg);
  color: var(--c-success);
  font-weight: 600;
  margin-left: 4px;
}
.ai-shortcut {
  margin-top: 12px;
  padding: 12px 14px;
  background: linear-gradient(135deg, var(--c-ai-bg), var(--c-primary-bg));
  border: 1px solid var(--c-ai);
  border-radius: var(--r-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all .15s;
}
.ai-shortcut:hover { transform: translateY(-1px); box-shadow: var(--sh-sm); }
.ai-shortcut-icon { font-size: 22px; }
.ai-shortcut-title { font-size: 13px; font-weight: 600; color: var(--c-text); }
.ai-shortcut-desc { font-size: 11px; color: var(--c-text-2); margin-top: 2px; }

/* ===== Split View (KR Management) ===== */
.split-view { display: flex; gap: 16px; min-height: calc(100vh - 120px); }
.split-left { width: 300px; flex-shrink: 0; }
.split-right { flex: 1; }

.kr-list-panel {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  overflow: hidden;
}
.kr-list-panel .panel-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--c-border-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.kr-list-panel .panel-head h3 { font-size: 14px; font-weight: 600; }
.kr-list-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--c-border-2);
  cursor: pointer;
  transition: background .15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.kr-list-item:hover { background: var(--c-bg); }
.kr-list-item.active { background: var(--c-primary-bg); }
.kr-list-item .ki-name { flex: 1; font-size: 14px; font-weight: 500; }
.kr-list-item .ki-pri { font-size: 10px; padding: 1px 6px; border-radius: var(--r-sm); font-weight: 600; }

.kr-detail-panel {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  padding: 24px;
}
.kr-detail-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 400px;
  color: var(--c-text-3);
  font-size: 14px;
}
.kr-detail-head { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--c-border-2); }
.kr-detail-head h2 { font-size: 20px; font-weight: 700; }
.kr-detail-meta { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.meta-chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--c-bg); color: var(--c-text-2); }

.section-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text-2);
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== Task Board ===== */
.filter-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-select {
  padding: 7px 12px;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  font-size: 13px;
  background: var(--c-surface);
  cursor: pointer;
  outline: none;
  color: var(--c-text-2);
}
.filter-select:focus { border-color: var(--c-primary); }

/* Search box */
.search-box {
  position: relative;
  flex: 1;
  max-width: 320px;
  min-width: 160px;
}
.search-box input {
  width: 100%;
  padding: 7px 12px 7px 32px;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  font-size: 13px;
  background: var(--c-surface);
  outline: none;
  color: var(--c-text);
  transition: border-color .15s;
}
.search-box input:focus { border-color: var(--c-primary); }
.search-box .search-icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  color: var(--c-text-3);
  pointer-events: none;
}

/* View toggle */
.view-toggle {
  display: inline-flex;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--c-surface);
}
.view-toggle button {
  padding: 6px 14px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  color: var(--c-text-2);
  font-weight: 500;
}
.view-toggle button.active { background: var(--c-primary); color: #fff; }

.task-list { background: var(--c-surface); border-radius: var(--r-lg); border: 1px solid var(--c-border-2); box-shadow: var(--sh-sm); overflow: hidden; }
.task-list .todo-row { padding: 12px 16px; border-bottom: 1px solid var(--c-border-2); }
.task-list .todo-row:last-child { border-bottom: none; }
.task-list .todo-row:hover { background: var(--c-bg); }

/* ===== Quadrant View ===== */
.quadrant-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 16px;
}
.quadrant {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 220px;
}
.quadrant .q-head { padding: 12px 16px; border-bottom: 1px solid var(--c-border-2); }
.quadrant .q-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.quadrant .q-sub { font-size: 11px; color: var(--c-text-3); margin-top: 2px; }
.quadrant .q-count { margin-left: auto; font-size: 12px; color: var(--c-text-3); font-weight: 400; }
.quadrant .q-body { padding: 4px 12px; flex: 1; }
.quadrant .q-body .todo-row { padding: 8px 4px; }
.quadrant .q-body .todo-actions { opacity: 1; }
.quadrant .q-empty { padding: 16px; text-align: center; color: var(--c-text-3); font-size: 12px; }
.quadrant.q1 { border-top: 3px solid var(--c-danger); }
.quadrant.q2 { border-top: 3px solid var(--c-primary); }
.quadrant.q3 { border-top: 3px solid var(--c-warning); }
.quadrant.q4 { border-top: 3px solid var(--c-success); }

/* ===== Weekly View ===== */
.week-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: nowrap;
}
.week-nav > button:not(.btn) {
  width: 32px; height: 32px;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  background: var(--c-surface);
  cursor: pointer;
  font-size: 14px;
  color: var(--c-text-2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.week-nav > button:not(.btn):hover { background: var(--c-bg); }
.week-nav .week-label { font-size: 15px; font-weight: 600; white-space: nowrap; }
.week-nav .btn-sm { white-space: nowrap; flex-shrink: 0; }
.week-nav .week-stats { margin-left: auto; font-size: 13px; color: var(--c-text-2); white-space: nowrap; }

.week-day {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  margin-bottom: 12px;
  overflow: hidden;
}
.week-day.selected { border: 2px solid var(--c-primary); box-shadow: 0 0 0 3px var(--c-primary-bg); }
.week-day .day-head {
  padding: 10px 16px;
  background: var(--c-bg);
  border-bottom: 1px solid var(--c-border-2);
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text-2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.week-day .day-head .day-count { font-size: 11px; color: var(--c-text-3); }
.week-day .day-todos { padding: 4px 12px; }
.week-day .day-todos .todo-row { padding: 8px 4px; }
.week-day.empty { background: transparent; border: none; box-shadow: none; }
.week-day.empty .day-head { background: transparent; border: none; padding: 4px 16px; opacity: .5; }
.week-day.empty .day-todos { display: none; }

/* ===== AI Page ===== */
.ai-hero {
  background: linear-gradient(135deg, var(--c-ai-bg), var(--c-primary-bg));
  border-radius: var(--r-xl);
  padding: 32px;
  text-align: center;
  margin-bottom: 24px;
}
.ai-hero h2 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--c-ai), var(--c-primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.ai-hero p { color: var(--c-text-2); margin-top: 8px; font-size: 14px; }
.ai-hero .ai-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; background: var(--c-ai); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 600; margin-top: 12px; }

.ai-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 32px; }
.ai-card {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  border-top: 3px solid var(--c-ai);
  box-shadow: var(--sh-sm);
  padding: 20px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
}
.ai-card:hover { box-shadow: var(--sh-md); transform: translateY(-2px); }
.ai-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  background: radial-gradient(circle, var(--c-ai-bg) 0%, transparent 70%);
  pointer-events: none;
}
.ai-card .ai-icon { font-size: 28px; margin-bottom: 12px; }
.ai-card h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.ai-card p { font-size: 13px; color: var(--c-text-2); line-height: 1.6; }
.ai-card .ai-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--c-ai);
  background: var(--c-ai-bg);
  padding: 3px 10px;
  border-radius: 999px;
}

/* AI Chat (interactive) */
.ai-chat {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  overflow: hidden;
  margin-bottom: 24px;
}
.ai-chat .chat-head { padding: 14px 20px; border-bottom: 1px solid var(--c-border-2); display: flex; align-items: center; gap: 8px; }
.ai-chat .chat-head h4 { font-size: 15px; font-weight: 600; }
.ai-chat .chat-body { padding: 20px; min-height: 280px; max-height: 460px; overflow-y: auto; }
.ai-chat .chat-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--c-text-3); text-align: center; padding: 40px 0; }
.ai-chat .chat-placeholder .ph-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
.ai-chat .chat-suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.ai-chat .chat-suggest button {
  padding: 6px 12px; border: 1px solid var(--c-border); border-radius: 999px;
  background: var(--c-surface); color: var(--c-text-2); font-size: 12px; cursor: pointer;
  transition: all .15s;
}
.ai-chat .chat-suggest button:hover { border-color: var(--c-ai); color: var(--c-ai); background: var(--c-ai-bg); }
.chat-msg { display: flex; gap: 10px; margin-bottom: 16px; }
.chat-msg.user { flex-direction: row-reverse; }
.chat-msg .chat-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.chat-msg.ai .chat-avatar { background: var(--c-ai-bg); }
.chat-msg.user .chat-avatar { background: var(--c-primary-bg); color: var(--c-primary); }
.chat-msg .chat-bubble { max-width: 82%; padding: 10px 14px; border-radius: var(--r-lg); font-size: 13px; line-height: 1.7; word-break: break-word; }
.chat-msg.ai .chat-bubble { background: var(--c-bg); border: 1px solid var(--c-border-2); }
.chat-msg.user .chat-bubble { background: var(--c-primary); color: #fff; }
.chat-msg .chat-bubble pre { white-space: pre-wrap; font-family: inherit; font-size: 12.5px; }
.chat-msg .chat-bubble .parsed-card {
  margin-top: 10px; padding: 10px; background: var(--c-surface); border: 1px dashed var(--c-border);
  border-radius: var(--r-md); font-size: 12px;
}
.chat-msg .chat-bubble .parsed-card .pc-row { display: flex; gap: 6px; margin: 3px 0; }
.chat-msg .chat-bubble .parsed-card .pc-row .pc-k { color: var(--c-text-3); min-width: 50px; }
.chat-msg .chat-bubble .parsed-card .pc-actions { margin-top: 8px; display: flex; gap: 6px; }
.chat-msg .chat-bubble .parsed-card .pc-actions button {
  padding: 4px 10px; border: none; border-radius: var(--r-sm); font-size: 11px; font-weight: 600; cursor: pointer;
}
.ai-chat .chat-input-bar { padding: 12px 20px; border-top: 1px solid var(--c-border-2); display: flex; gap: 8px; }
.ai-chat .chat-input-bar input { flex: 1; padding: 10px 14px; border: 1px solid var(--c-border); border-radius: var(--r-md); font-size: 13px; outline: none; background: var(--c-surface); color: var(--c-text); }
.ai-chat .chat-input-bar input:focus { border-color: var(--c-ai); }
.ai-chat .chat-input-bar button { padding: 10px 20px; border: none; border-radius: var(--r-md); background: var(--c-ai); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.ai-chat .chat-input-bar button:hover { background: var(--c-primary); }
.ai-chat .chat-input-bar button:disabled { background: var(--c-border-2); color: var(--c-text-3); cursor: not-allowed; }
.typing-dots { display: inline-flex; gap: 3px; }
.typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--c-text-3); animation: blink 1.2s infinite both; }
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity:.3; } 40% { opacity:1; } }

/* Version Roadmap */
.roadmap {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  padding: 24px;
}
.roadmap h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
.roadmap-timeline { display: flex; gap: 24px; }
.roadmap-item { flex: 1; padding: 20px; border-radius: var(--r-lg); border: 1px solid var(--c-border-2); position: relative; }
.roadmap-item.current { border-color: var(--c-primary); background: var(--c-primary-bg); }
.roadmap-item .rm-ver { font-size: 20px; font-weight: 700; }
.roadmap-item .rm-status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; display: inline-block; }
.roadmap-item .rm-status.done { background: var(--c-success-bg); color: var(--c-success); }
.roadmap-item .rm-status.current { background: var(--c-primary-bg); color: var(--c-primary); }
.roadmap-item .rm-status.planned { background: var(--c-border-2); color: var(--c-text-2); }
.roadmap-item ul { list-style: none; margin-top: 12px; }
.roadmap-item ul li { font-size: 12px; color: var(--c-text-2); padding: 4px 0; padding-left: 16px; position: relative; }
.roadmap-item ul li::before { content: '•'; position: absolute; left: 0; color: var(--c-text-3); }

/* ===== Settings ===== */
.settings-section {
  background: var(--c-surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--c-border-2);
  box-shadow: var(--sh-sm);
  padding: 24px;
  margin-bottom: 16px;
}
.settings-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--c-border-2); gap: 12px; }
.settings-row:last-child { border-bottom: none; }
.settings-row label { font-size: 14px; }
.settings-row .sr-desc { font-size: 12px; color: var(--c-text-3); margin-top: 2px; }
.settings-row .sr-val { font-size: 13px; color: var(--c-text-2); }

/* Theme switch */
.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; cursor: pointer; inset: 0; background: var(--c-border); border-radius: 999px; transition: .2s; }
.switch .slider::before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + .slider { background: var(--c-primary); }
.switch input:checked + .slider::before { transform: translateX(20px); }

/* ===== Buttons ===== */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: #4f46e5; }
[data-theme="dark"] .btn-primary:hover { background: #6366f1; }
.btn-secondary { background: var(--c-surface); color: var(--c-text-2); border: 1px solid var(--c-border); }
.btn-secondary:hover { background: var(--c-bg); }
.btn-danger { background: var(--c-danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ===== Modal ===== */
.modal-backdrop {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--backdrop);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn .15s ease;
}
.modal {
  background: var(--c-surface);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-lg);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-head {
  padding: 20px 24px;
  border-bottom: 1px solid var(--c-border-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-head h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.modal-bar { height: 4px; border-radius: 4px 4px 0 0; }
.modal-bar.todo { background: linear-gradient(90deg, var(--c-primary), var(--c-primary-light)); }
.modal-bar.kr { background: linear-gradient(90deg, var(--c-warning), #f59e0b); }
.modal-close { width: 28px; height: 28px; border: none; background: var(--c-bg); border-radius: var(--r-sm); cursor: pointer; font-size: 16px; color: var(--c-text-2); display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--c-border); }
.modal-body { padding: 20px 24px; }
.modal-foot { padding: 16px 24px; border-top: 1px solid var(--c-border-2); display: flex; justify-content: flex-end; gap: 8px; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--c-text-2); }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: border-color .15s;
  background: var(--c-surface);
  color: var(--c-text);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--c-primary); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

/* Shortcuts help */
.shortcut-list { display: flex; flex-direction: column; gap: 8px; }
.shortcut-list .sc-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: var(--r-md); background: var(--c-bg); }
.shortcut-list .sc-row .sc-desc { font-size: 13px; color: var(--c-text-2); }
.shortcut-list .sc-row kbd { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; padding: 3px 8px; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-sm); color: var(--c-text); font-weight: 600; }
.shortcut-list .sc-capture-btn { font-size: 11px; padding: 3px 10px; }
.shortcut-list .sc-capture-btn.capturing { background: var(--c-primary); color: #fff; border-color: var(--c-primary); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

/* ===== Toast ===== */
#toast-container {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 10px 16px;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  box-shadow: var(--sh-lg);
  animation: toastIn .3s ease;
}
.toast.success { background: var(--c-success); }
.toast.error { background: var(--c-danger); }
.toast.info { background: var(--c-primary); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Empty state */
.empty-state { text-align: center; padding: 48px 20px; color: var(--c-text-3); }
.empty-state .es-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
.empty-state .es-text { font-size: 14px; }

/* Dashboard bottom section */
.dash-bottom { display: flex; gap: 16px; align-items: flex-start; }
.dash-bottom .dash-main { flex: 1; min-width: 0; }
.dash-bottom .dash-side { width: 280px; flex-shrink: 0; }

/* Mobile toggle */
.mobile-menu-btn { display: none; }

/* Mobile backdrop */
.mobile-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--backdrop);
  z-index: 90;
}
.mobile-backdrop.show { display: block; }

/* Responsive */
@media (max-width: 900px) {
  .dash-bottom { flex-direction: column; }
  .dash-bottom .dash-side { width: 100%; }
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .page { padding: 16px; }
  .mobile-menu-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px; height: 40px;
    border: 1px solid var(--c-border);
    border-radius: var(--r-md);
    background: var(--c-surface);
    cursor: pointer;
    font-size: 20px;
    flex-shrink: 0;
  }
  .page-header { align-items: center; }
  .split-view { flex-direction: column; }
  .split-left { width: 100%; }
  .kr-grid { grid-template-columns: 1fr; }
  .ai-grid { grid-template-columns: 1fr; }
  .quadrant-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
  .quadrant { min-height: auto; }
  .filter-bar { gap: 8px; }
  .search-box { max-width: 100%; }
  .todo-actions { opacity: 1; }
  .nav-item .shortcut { display: none; }
  .page-title { font-size: 20px; }
  .modal { max-width: 100%; }
  .modal-body, .modal-head, .modal-foot { padding: 16px; }
}

@media (max-width: 480px) {
  .page { padding: 12px; }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .filter-select { width: 100%; }
  .ai-hero { padding: 24px 16px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>OKR Todo</h1>
      <div class="ver">V1.1 · 本地版</div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
        <span class="icon">🏠</span> 首页
      </div>
      <div class="nav-item" data-view="krs" onclick="switchView('krs')">
        <span class="icon">📂</span> KR管理
      </div>
      <div class="nav-item" data-view="tasks" onclick="switchView('tasks')">
        <span class="icon">📋</span> 任务看板
      </div>
      <div class="nav-item" data-view="notes" onclick="switchView('notes')">
        <span class="icon">📝</span> 笔记看板
      </div>
      <div class="nav-item" data-view="weekly" onclick="switchView('weekly')">
        <span class="icon">📅</span> 周视图
      </div>
      <div class="nav-item" data-view="ai" onclick="switchView('ai')">
        <span class="icon">🤖</span> AI能力 <span class="badge">体验</span>
      </div>
      <div class="nav-item" data-view="settings" onclick="switchView('settings')">
        <span class="icon">⚙️</span> 设置
      </div>
    </nav>
    <div class="sidebar-footer">
      本地存储 · 数据仅存于当前设备
    </div>
  </aside>
  <div class="mobile-backdrop" id="mobile-backdrop" onclick="closeSidebar()"></div>

  <!-- Main Content -->
  <main class="main">
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-krs"></div>

<script>
/* ===== State ===== */
const DEFAULT_SHORTCUTS = {
  newTodo: 'n',
  toggleTheme: 't',
  quadrantToggle: 'q',
  generateReport: 'r',
  searchFocus: '/',
  showHelp: '?'
};

const SHORTCUT_LABELS = {

  toggleTheme: '切换深色/浅色模式',
  quadrantToggle: '列表/四象限切换',
  generateReport: '生成本周周报',
  searchFocus: '聚焦任务搜索',
  showHelp: '显示快捷键帮助'
};

let state = {
  view: 'dashboard',
  currentDomainId: null,
  currentKRId: null,
  weekOffset: 0,
  selectedDate: '',
  filters: { domain: 'all', priority: 'all', status: 'all' },
  searchQuery: '',
  taskView: 'list',
  data: { domains: [], krs: [], todos: [], quickNotes: [], checkins: {} },
  prefs: { theme: 'light', shortcuts: { ...DEFAULT_SHORTCUTS } },
  aiChat: [],
  notesSearch: '',
  notesTypeFilter: 'all'
};

const STORAGE_KEY = 'okr-todo-app-v1';
const PREFS_KEY = 'okr-todo-app-v1-prefs';

/* ===== Data Layer ===== */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state.data = JSON.parse(raw);
      if (!state.data.checkins) state.data.checkins = {};
      if (!state.data.quickNotes) state.data.quickNotes = [];
      if (state.data.domains) state.data.domains.forEach((d, i) => {
        if (d.order === undefined) d.order = i;
        if (d.hidden === undefined) d.hidden = false;
      });
      if (state.data.todos) state.data.todos.forEach((t, i) => {
        if (t.ddlDate === undefined) t.ddlDate = '';
        if (t.category !== undefined) delete t.category;
        if (t.showHome === undefined) t.showHome = true;
        if (t.order === undefined) t.order = i;
        if (t.docLink === undefined) t.docLink = '';
      });
      if (state.data.krs) state.data.krs.forEach((k, i) => {
        if (k.ddlDate === undefined) k.ddlDate = '';
        if (k.ddlText === undefined) k.ddlText = k.deadline || '';
        if (k.deadline !== undefined) delete k.deadline;
        if (k.docLink === undefined) k.docLink = '';
        if (k.order === undefined) k.order = i;
      });
      if (state.data.quickNotes) state.data.quickNotes.forEach(q => {
        if (q.krId === undefined) q.krId = '';
      });
    }
  } catch(e) { console.error('Load failed', e); }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
}

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.prefs = Object.assign(state.prefs, saved);
      state.prefs.shortcuts = Object.assign({ ...DEFAULT_SHORTCUTS }, saved.shortcuts || {});
    }
  } catch(e) {}
}

function savePrefs() {
  localStorage.setItem(PREFS_KEY, JSON.stringify(state.prefs));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ===== Theme ===== */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.prefs.theme);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = state.prefs.theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  state.prefs.theme = state.prefs.theme === 'dark' ? 'light' : 'dark';
  savePrefs();
  applyTheme();
  if (state.view === 'settings') render();
  toast(state.prefs.theme === 'dark' ? '已切换深色模式' : '已切换浅色模式', 'info');
}

/* ===== Sample Data (generic) ===== */
function initData() {

  const d2ago = dateStr(new Date(now.getTime() - 86400000 * 2));

  state.data = {
    domains: [

      { id: 'k2', domainId: 'd2', name: '每日阅读', type: 'habit', goal: '每天阅读30分钟', priority: 'P2', status: '进行中', progress: 0, ddlDate: '', ddlText: '', notes: '习惯型KR：点击打卡按钮记录每日完成', nextStep: '', docLink: '', checklist: [] },
      { id: 'k3', domainId: 'd3', name: '规律作息', type: 'habit', goal: '23点前入睡', priority: 'P2', status: '进行中', progress: 0, ddlDate: '', ddlText: '', notes: '', nextStep: '', docLink: '', checklist: [] }
    ],
    todos: [
      { id: 't1', krId: 'k1', domainId: 'd1', title: '撰写项目周报', priority: 'P0', ddl: '', ddlDate: '', ddlText: '本周', nextStep: '汇总本周进展与风险', notes: '示例任务，可自由编辑或删除', knowledge: '做完后可以在这里记录踩坑经验、攻略等，笔记看板会自动汇总。', status: '进行中', done: false, showHome: true, createdAt: now.getTime() },

      { id: 't4', krId: '', domainId: 'd3', title: '整理桌面文件', priority: 'P3', ddl: '', ddlDate: '', ddlText: '有空', nextStep: '', notes: '不紧急不重要事项', knowledge: '', status: '待开始', done: false, showHome: true, createdAt: now.getTime() }
    ],
    quickNotes: [

    ],
    checkins: {
      'k2': { [d3ago]: true, [d2ago]: true, [yesterdayStr]: true },
      'k3': {}
    }
  };
  saveData();
}

/* ===== Helpers ===== */
function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getWeekDates(offset) {
  const now = new Date();
  const day = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1 + offset * 7);
  monday.setHours(0,0,0,0);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function weekLabel(offset) {
  const dates = getWeekDates(offset);
  const s = dates[0], e = dates[6];
  const fmt = d => `${d.getMonth()+1}.${d.getDate()}`;
  if (offset === 0) return `本周 ${fmt(s)} - ${fmt(e)}`;
  if (offset === -1) return `上周 ${fmt(s)} - ${fmt(e)}`;
  if (offset === 1) return `下周 ${fmt(s)} - ${fmt(e)}`;
  return `${fmt(s)} - ${fmt(e)}`;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderLinkableText(text) {
  if (!text) return '';
  const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;
  const parts = text.split(urlRegex);
  return parts.map(p => {
    if (!p) return '';
    if (/^https?:\/\/|^www\./.test(p)) {
      const href = p.startsWith('www.') ? 'https://' + p : p;
      return `<a href="${esc(href)}" target="_blank" rel="noopener" style="color:var(--c-primary);text-decoration:underline;">${esc(p)}</a>`;
    }
    return esc(p);
  }).join('');
}

function formatDDL(t) {
  if (!t.ddlDate && !t.ddlText) return '';
  if (t.ddlDate) {
    const d = new Date(t.ddlDate + 'T00:00:00');
    const label = isNaN(d) ? t.ddlDate : `${d.getMonth()+1}/${d.getDate()}`;
    return t.ddlText ? `${label} (${esc(t.ddlText)})` : label;
  }
  return esc(t.ddlText);
}

function getDomain(id) { return state.data.domains.find(d => d.id === id); }
function getKR(id) { return state.data.krs.find(k => k.id === id); }
function getTodosByKR(krId) { return state.data.todos.filter(t => t.krId === krId); }
function getTodosByDomain(domainId) { return state.data.todos.filter(t => t.domainId === domainId); }
function getKRsByDomain(domainId) { return state.data.krs.filter(k => k.domainId === domainId); }

function calcProgress(kr) {
  if (kr.type === 'habit') return 0;
  const todos = getTodosByKR(kr.id);
  if (todos.length === 0) return kr.progress || 0;
  const done = todos.filter(t => t.done).length;
  return Math.round(done / todos.length * 100);
}

function getStreak(krId) {
  const checkins = state.data.checkins[krId] || {};
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 30; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    if (checkins[dateStr(d)]) streak++;
    else if (i > 0) break;
  }
  return streak;
}

function isHabitCheckedToday(krId) {
  return !!(state.data.checkins[krId] || {})[dateStr(new Date())];
}

/* ===== View Switching ===== */
function switchView(view) {
  state.view = view;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + view).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.querySelector(`.nav-item[data-view="${view}"]`);
  if (navEl) navEl.classList.add('active');
  render();
  closeSidebar();
}

/* ===== Render ===== */
function render() {
  const r = {
    dashboard: renderDashboard,
    krs: renderKRs,
    tasks: renderTasks,
    notes: renderNotes,
    weekly: renderWeekly,
    ai: renderAI,
    settings: renderSettings
  };
  (r[state.view] || r.dashboard)();
  applyTheme();
}

function pageHeader(title, subtitle) {
  return `<div class="page-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="mobile-menu-btn" onclick="openSidebar()">☰</button>
      <div>
        <div class="page-title">${title}</div>
        <div class="page-subtitle">${subtitle}</div>
      </div>
    </div>
    <div class="page-header-actions">
      <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="切换主题 (T)">${state.prefs.theme === 'dark' ? '☀️' : '🌙'}</button>
    </div>
  </div>`;
}

/* ===== Dashboard ===== */
function renderDashboard() {
  const domains = state.data.domains.filter(d => !d.hidden);
  if (!state.currentDomainId && domains.length > 0) state.currentDomainId = domains[0].id;

  const krs = getKRsByDomain(state.currentDomainId);

  const weekDates = getWeekDates(0);
  const weekTodos = state.data.todos.filter(t => !t.done && t.showHome !== false && todoBelongsToWeek(t, weekDates)).sort((a,b) => {
    const pri = { P0:0, P1:1, P2:2, P3:3 };
    return (pri[a.priority] ?? 4) - (pri[b.priority] ?? 4);
  }).slice(0, 6);

  const priLabel = p => `<span class="kr-pri pri-${esc(p)}">${esc(p)}</span>`;

  const html = `
    ${pageHeader('首页', '概览你的目标与待办')}

    <div class="domain-tabs">
      ${domains.map(d => `<div class="domain-tab ${d.id===state.currentDomainId?'active':''}" draggable="true" ondragstart="onDomainDragStart(event,'${d.id}')" ondragend="onDragEndClean(event)" ondragover="onDomainDragOver(event)" ondrop="onDomainDrop(event,'${d.id}')" ondragleave="onDragLeaveClean(event)" onclick="selectDomain('${d.id}')">
        <span>${esc(d.name)}</span>
        <span class="domain-edit-btn" onclick="event.stopPropagation();openDomainModal('${d.id}')" title="编辑领域">✏️</span>
        <span class="domain-del-btn" onclick="event.stopPropagation();deleteDomain('${d.id}')" title="删除领域">🗑</span>
      </div>`).join('')}
      <div class="domain-tab add" onclick="openDomainModal()">+ 新建领域</div>
    </div>

    <div class="kr-grid">
      ${krs.map(kr => {
        if (kr.type === 'habit') {
          const streak = getStreak(kr.id);
          const checked = isHabitCheckedToday(kr.id);
          const today = new Date();
          const heatDays = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date(today);
            d.setDate(today.getDate() - i);
            const ds = dateStr(d);
            const isChecked = (state.data.checkins[kr.id] || {})[ds];
            const isToday = i === 0;
            heatDays.push(`<div class="day ${isChecked?'checked':''} ${isToday?'today':''}">${d.getDate()}</div>`);
          }
          return `<div class="kr-card" draggable="true" ondragstart="onKRDragStart(event,'${kr.id}')" ondragend="onDragEndClean(event)" ondragover="onKRDragOver(event)" ondrop="onKRDrop(event,'${kr.id}')" ondragleave="onDragLeaveClean(event)" onclick="openKRDetailed('${kr.id}')">
            <div class="kr-top">
              <div class="kr-name">${esc(kr.name)}</div>
              <span class="kr-type-tag habit">习惯</span>
            </div>
            <div class="heatmap">${heatDays.join('')}</div>
            <div class="kr-foot">
              ${priLabel(kr.priority)}
              <span>🔥连续 ${streak} 天</span>
              ${checked ? '<span style="color:var(--c-success)">✅ 今日已打卡</span>' : `<span class="btn btn-sm btn-primary" style="padding:2px 10px;" onclick="event.stopPropagation();checkIn('${kr.id}')">打卡</span>`}
            </div>
            ${kr.nextStep ? `<div class="kr-next">📍 ${esc(kr.nextStep)}</div>` : ''}
          </div>`;
        } else {
          const prog = calcProgress(kr);
          const todoCount = getTodosByKR(kr.id).length;
          const doneCount = getTodosByKR(kr.id).filter(t => t.done).length;
          return `<div class="kr-card" draggable="true" ondragstart="onKRDragStart(event,'${kr.id}')" ondragend="onDragEndClean(event)" ondragover="onKRDragOver(event)" ondrop="onKRDrop(event,'${kr.id}')" ondragleave="onDragLeaveClean(event)" onclick="openKRDetailed('${kr.id}')">
            <div class="kr-top">
              <div class="kr-name">${esc(kr.name)}</div>
              <span class="kr-type-tag project">项目</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
            <div class="kr-foot">
              ${priLabel(kr.priority)}
              <span>${doneCount}/${todoCount} 完成 · ${prog}%</span>
              <span>${esc(kr.status)}</span>
            </div>
            ${kr.nextStep ? `<div class="kr-next">📍 ${esc(kr.nextStep)}</div>` : ''}
          </div>`;
        }
      }).join('')}
      <div class="kr-card-add" onclick="openKRModal()">+ 新建 KR</div>
    </div>

    <div class="dash-bottom">
      <div class="dash-main">
        <div class="weekly-overview">
          <h3 style="display:flex;align-items:center;justify-content:space-between;">
            <span>📌 本周待办 <span class="count">(${weekTodos.length}项)</span></span>
            <button class="btn btn-primary btn-sm" onclick="openTodoModal(null)">+ 新建</button>
          </h3>
          ${weekTodos.length > 0 ? weekTodos.map(t => renderTodoRow(t, null, {showDelete: false})).join('') : '<div class="empty-state" style="padding:20px;"><div class="es-text">暂无待办，去添加吧</div></div>'}
        </div>
      </div>
      <div class="dash-side">
        <div class="quick-notes">
          <h3>💡 闪念笔记</h3>
          <div class="qn-input">
            <input type="text" id="qn-input" placeholder="快速记录，回车即保存..." onkeydown="if(event.key==='Enter')addQuickNote()">
            <button class="btn btn-primary btn-sm" onclick="openQuickNoteModal()" title="完整编辑并选择归属">＋</button>
          </div>
          ${state.data.quickNotes.slice(0, 5).map(q => {
            const kr = q.krId ? getKR(q.krId) : null;
            return `
            <div class="qn-item" onclick="openQuickNoteModal('${q.id}')" style="cursor:pointer;">
              <span class="qn-text">${esc(q.content)}</span>
              <div style="display:flex;align-items:center;gap:6px;">
                ${kr ? `<span style="font-size:10px;padding:1px 6px;background:var(--c-primary-bg);color:var(--c-primary);border-radius:999px;">${esc(kr.name)}</span>` : ''}
                <span class="qn-time">${formatDate(q.createdAt).split(' ')[0]}</span>
                <span class="qn-del" onclick="event.stopPropagation();deleteQuickNote('${q.id}')">✕</span>
              </div>
            </div>
          `}).join('') || '<div class="empty-state" style="padding:12px;"><div class="es-text">还没有笔记</div></div>'}
        </div>

        <div class="ai-shortcut" onclick="switchView('ai')">
          <div class="ai-shortcut-icon">🤖</div>
          <div class="ai-shortcut-text">
            <div class="ai-shortcut-title">AI 助手</div>
            <div class="ai-shortcut-desc">创建Todo / 领域 / KR · 生成周报</div>
          </div>
          <span style="margin-left:auto;color:var(--c-text-3);">→</span>
        </div>
      </div>
    </div>
  `;
  document.getElementById('page-dashboard').innerHTML = html;
}

function renderTodoRow(t, re, opts) {
  const domain = getDomain(t.domainId);
  const kr = t.krId ? getKR(t.krId) : null;
  const h = !!re;
  const showDelete = !opts || opts.showDelete !== false;
  return `<div class="todo-row ${h?'highlight':''}" draggable="true" ondragstart="onTodoDragStart(event,'${t.id}')" ondragend="onTodoDragEnd(event)" ondragover="onTodoDragOver(event)" ondrop="onTodoDrop(event,'${t.id}')" ondragleave="onTodoDragLeave(event)">
    <span class="todo-drag-handle">⠿</span>
    <div class="todo-check ${t.done?'done':''}" onclick="toggleTodo('${t.id}')"></div>
    <div class="todo-info">
      <div class="todo-title ${t.done?'done':''}">${highlightHtml(t.title, re)}</div>
      <div class="todo-meta">
        ${t.priority ? `<span class="kr-pri pri-${esc(t.priority)}">${esc(t.priority)}</span>` : ''}
        ${kr ? `<span>${esc(kr.name)}</span>` : ''}
        ${domain ? `<span>${esc(domain.name)}</span>` : ''}
        ${formatDDL(t) ? `<span class="todo-ddl">⏰ ${formatDDL(t)}</span>` : ''}
        ${t.docLink ? `<span>📄 ${renderLinkableText(t.docLink)}</span>` : ''}
        ${t.nextStep ? `<span>📝 ${esc(t.nextStep)}</span>` : ''}
        ${t.notes ? `<span>📍 ${esc(t.notes)}</span>` : ''}
      </div>
    </div>
    <div class="todo-actions">
      <button class="todo-action-btn" onclick="event.stopPropagation();openTodoModal('${t.id}')" title="编辑">✏️</button>
      ${showDelete ? `<button class="todo-action-btn" onclick="event.stopPropagation();deleteTodo('${t.id}')" title="删除">🗑</button>` : ''}
    </div>
  </div>`;
}

/* ===== KR Management ===== */
function selectDomain(id) {
  state.currentDomainId = id;
  render();
}

function jumpToDomainKR(domainId) {
  state.currentDomainId = domainId;
  state.currentKRId = null;
  switchView('krs');
  closeSidebar();
}

function renderKRs() {
  const domains = state.data.domains.filter(d => !d.hidden);
  if (!state.currentDomainId && domains.length > 0) state.currentDomainId = domains[0].id;

  const krs = getKRsByDomain(state.currentDomainId);
  if (!state.currentKRId && krs.length > 0) state.currentKRId = krs[0].id;
  const kr = state.currentKRId ? getKR(state.currentKRId) : null;

  const html = `
    ${pageHeader('KR 管理', '管理各领域下的关键结果')}

    <div class="domain-tabs">
      ${domains.map(d => `<div class="domain-tab ${d.id===state.currentDomainId?'active':''}" draggable="true" ondragstart="onDomainDragStart(event,'${d.id}')" ondragend="onDragEndClean(event)" ondragover="onDomainDragOver(event)" ondrop="onDomainDrop(event,'${d.id}')" ondragleave="onDragLeaveClean(event)" onclick="selectDomain('${d.id}')">${esc(d.name)}</div>`).join('')}
      <div class="domain-tab add" onclick="openDomainModal()">+ 新建领域</div>
    </div>

    <div class="split-view">
      <div class="split-left">
        <div class="kr-list-panel">
          <div class="panel-head">
            <h3>KR 列表</h3>
            <button class="btn btn-primary btn-sm" onclick="openKRModal()">+ KR</button>
          </div>
          ${krs.length > 0 ? krs.map(k => `

function renderKRDetail(kr) {

      days.push(`<div class="day ${isChecked?'checked':''} ${isToday?'today':''}" style="width:20px;height:20px;font-size:8px;" title="${ds}">${d.getDate()}</div>`);

      <div class="todo-meta">
        <span class="kr-pri pri-${esc(kr.priority)}">${esc(kr.priority)}</span>
        ${domain ? `<span>${esc(domain.name)}</span>` : ''}

}

function getHabitKRAsTodo(kr) {
  const checked = isHabitCheckedToday(kr.id);
  return {
    id: kr.id, title: kr.name, priority: kr.priority,
    domainId: kr.domainId, krId: kr.id,
    ddlDate: kr.ddlDate || '', ddlText: kr.ddlText || '',
    nextStep: kr.nextStep || '', docLink: kr.docLink || '',
    notes: kr.notes || '', status: kr.status || '进行中',
    done: checked, _isHabit: true, _kr: kr, createdAt: 0
  };
}

function renderTasks() {
  const domains = state.data.domains.filter(d => !d.hidden);
  let todos = state.data.todos.slice();

  // Include habit KRs as virtual todos
  let habitKRs = state.data.krs.filter(k => k.type === 'habit');
  if (state.filters.domain !== 'all') habitKRs = habitKRs.filter(k => k.domainId === state.filters.domain);
  if (state.filters.priority !== 'all') habitKRs = habitKRs.filter(k => k.priority === state.filters.priority);
  if (state.filters.status === 'active') habitKRs = habitKRs.filter(k => !isHabitCheckedToday(k.id));
  if (state.filters.status === 'done') habitKRs = habitKRs.filter(k => isHabitCheckedToday(k.id));

  const habitItems = habitKRs.map(k => getHabitKRAsTodo(k));

  if (state.filters.domain !== 'all') todos = todos.filter(t => t.domainId === state.filters.domain);
  if (state.filters.priority !== 'all') todos = todos.filter(t => t.priority === state.filters.priority);
  if (state.filters.status === 'active') todos = todos.filter(t => !t.done);
  if (state.filters.status === 'done') todos = todos.filter(t => t.done);

  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    todos = todos.filter(t => {
      const kr = t.krId ? getKR(t.krId) : null;
      const domain = getDomain(t.domainId);
      return [t.title, t.notes, t.nextStep, t.ddlDate, t.ddlText, kr?.name, domain?.name]
        .filter(Boolean).some(s => String(s).toLowerCase().includes(q));
    });
  }

  // Merge todos and habit items for unified display
  const allItems = [...todos, ...habitItems];

  const priOrder = { P0: 0, P1: 1, P2: 2, P3: 3 };
  allItems.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (priOrder[a.priority] ?? 4) - (priOrder[b.priority] ?? 4);
  });

  const q = state.searchQuery ? state.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : '';
  const re = q ? new RegExp(`(${q})`, 'gi') : null;
  const highlight = !!state.searchQuery;
  const emptyText = state.searchQuery ? '没有匹配的任务' : '暂无符合条件的任务';

  const renderItem = (item, re) => {
    if (item._isHabit) return renderHabitRow(item._kr, re);
    return renderTodoRow(item, re);
  };

  const html = `
    ${pageHeader('任务看板', '所有待办一览')}

    <div class="filter-bar">
      <select class="filter-select" onchange="setFilter('domain',this.value)">
        <option value="all">全部领域</option>
        ${domains.map(d => `<option value="${d.id}" ${state.filters.domain===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="setFilter('priority',this.value)">
        <option value="all">全部优先级</option>
        <option value="P0" ${state.filters.priority==='P0'?'selected':''}>P0</option>
        <option value="P1" ${state.filters.priority==='P1'?'selected':''}>P1</option>
        <option value="P2" ${state.filters.priority==='P2'?'selected':''}>P2</option>
        <option value="P3" ${state.filters.priority==='P3'?'selected':''}>P3</option>
      </select>
      <select class="filter-select" onchange="setFilter('status',this.value)">
        <option value="all">全部状态</option>
        <option value="active" ${state.filters.status==='active'?'selected':''}>未完成</option>
        <option value="done" ${state.filters.status==='done'?'selected':''}>已完成</option>
      </select>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="task-search" value="${esc(state.searchQuery)}" placeholder="搜索任务标题/备注... (/)" oninput="onSearchInput(this.value)">
      </div>
      <div class="view-toggle">
        <button class="${state.taskView==='list'?'active':''}" onclick="setTaskView('list')">📋 列表</button>
        <button class="${state.taskView==='quadrant'?'active':''}" onclick="setTaskView('quadrant')">⊞ 四象限</button>
      </div>
      <button class="btn btn-primary" onclick="openTodoModal(null)">+ 新建Todo</button>
      <span style="font-size:13px;color:var(--c-text-3);margin-left:auto;">共 ${allItems.length} 项</span>
    </div>

    ${state.taskView === 'quadrant' ? renderQuadrant(allItems, re, highlight, renderItem) : `
      <div class="task-list">
        ${allItems.length > 0 ? allItems.map(t => renderItem(t, highlight ? re : null)).join('') : `<div class="empty-state"><div class="es-icon">📭</div><div class="es-text">${emptyText}</div></div>`}
      </div>
    `}
  `;
  document.getElementById('page-tasks').innerHTML = html;
  // keep focus on search after render
  if (state.view === 'tasks') {
    const si = document.getElementById('task-search');
    if (si && document.activeElement !== si && state._searchFocused) {
      const pos = si.value.length;
      si.focus();
      try { si.setSelectionRange(pos, pos); } catch(e) {}
    }
  }
}

function highlightHtml(text, re) {
  if (!text || !re) return esc(text);
  const parts = String(text).split(re);
  return parts.map((p, i) => i % 2 === 1 ? `<mark style="background:var(--c-warning-bg);color:var(--c-warning);padding:0 2px;border-radius:2px;">${esc(p)}</mark>` : esc(p)).join('');
}

function renderQuadrant(todos, re, highlight, renderItem) {
  const renderFn = renderItem || ((t, re) => renderTodoRow(t, re));
  const quadrants = {
    q1: { title: '🔴 紧急且重要', sub: 'P0 · 立即做', items: [] },
    q2: { title: '🟣 重要不紧急', sub: 'P1 · 计划做', items: [] },
    q3: { title: '🟡 紧急不重要', sub: 'P2 · 快速做', items: [] },
    q4: { title: '🟢 不重要不紧急', sub: 'P3 · 稍后做', items: [] }
  };
  todos.forEach(t => {
    if (t.priority === 'P0') quadrants.q1.items.push(t);
    else if (t.priority === 'P1') quadrants.q2.items.push(t);
    else if (t.priority === 'P2') quadrants.q3.items.push(t);
    else quadrants.q4.items.push(t);
  });

  return `<div class="quadrant-grid">
    ${Object.entries(quadrants).map(([key, q]) => `
      <div class="quadrant ${key}">
        <div class="q-head">
          <div class="q-title">${q.title} <span class="q-count">${q.items.length}项</span></div>
          <div class="q-sub">${q.sub}</div>
        </div>
        <div class="q-body">
          ${q.items.length > 0 ? q.items.map(t => renderFn(t, highlight ? re : null)).join('') : '<div class="q-empty">暂无任务</div>'}
        </div>
      </div>
    `).join('')}
  </div>`;
}

function setFilter(key, val) {
  state.filters[key] = val;
  render();
}

function onSearchInput(val) {
  state.searchQuery = val;
  state._searchFocused = true;
  render();

}

/* ===== Weekly View ===== */
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function todoBelongsToDay(t, d, i, isWeekend) {
  if (t.ddlDate) {
    const todoDate = new Date(t.ddlDate + 'T00:00:00');
    if (!isNaN(todoDate)) {
      // Done todos: only show on deadline day
      if (t.done) return sameDay(todoDate, d);
      // Undone todos: show from today to deadline day (inclusive)
      const today = new Date();
      today.setHours(0,0,0,0);
      const dayStart = new Date(d);
      dayStart.setHours(0,0,0,0);
      if (dayStart >= today && dayStart <= todoDate) return true;
      // Also show if deadline is before today (overdue) - show on every day until done
      if (todoDate < today) return true;
    }
  }
  if (!t.ddlText) return false;
  const ddl = t.ddlText;
  if (ddl.includes(`${d.getMonth()+1}.${d.getDate()}`) || ddl.includes(`${d.getMonth()+1}/${d.getDate()}`)) return true;
  if (ddl.includes('每天') || ddl.includes('每日')) return true;
  if (ddl.includes('本周末') || ddl.includes('这周末')) return isWeekend;
  if (ddl.includes('本周') && !ddl.includes('末')) return true;
  if (i === 0 && (ddl.includes('今天') || ddl.includes('今日'))) return true;
  return false;
}

function todoBelongsToWeek(t, dates) {
  return dates.some((d, i) => todoBelongsToDay(t, d, i, i >= 4));
}

function isoOf(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function renderWeekly() {
  const dates = getWeekDates(state.weekOffset);
  const dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
  const today = new Date();
  today.setHours(0,0,0,0);
  if (!state.selectedDate) state.selectedDate = isoOf(today);

  let total = 0, done = 0;
  const dayGroups = dates.map((d, i) => {
    const isWeekend = i >= 4;
    const dayTodos = state.data.todos.filter(t => todoBelongsToDay(t, d, i, isWeekend));
    // Add habit KRs that belong to this day (every day for habits)
    const dayHabits = state.data.krs.filter(k => k.type === 'habit').map(kr => getHabitKRAsTodo(kr));
    const allDayItems = [...dayTodos, ...dayHabits];
    total += allDayItems.length;
    done += allDayItems.filter(t => t.done).length;
    return { date: d, dayName: dayNames[i], todos: allDayItems };
  });

  const activeTodos = state.data.todos.filter(t => !t.done && todoBelongsToWeek(t, dates));
  const activeHabits = state.data.krs.filter(k => k.type === 'habit' && !isHabitCheckedToday(k.id)).map(k => getHabitKRAsTodo(k));
  const allActive = [...activeTodos, ...activeHabits].sort((a,b) => {
    const pri = { P0:0, P1:1, P2:2, P3:3 };
    return (pri[a.priority] ?? 4) - (pri[b.priority] ?? 4);
  });

  const html = `
    ${pageHeader('周视图', '按周组织你的待办')}

    <div class="week-nav">
      <button onclick="state.weekOffset--;render()">‹</button>
      <span class="week-label">${weekLabel(state.weekOffset)}</span>
      <button onclick="state.weekOffset++;render()">›</button>
      ${state.weekOffset !== 0 ? `<button class="btn btn-secondary btn-sm" onclick="state.weekOffset=0;render()">回到本周</button>` : ''}
      <span class="week-stats">${done}/${total} 已完成</span>
    </div>

    <div style="margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;">
      <label style="font-size:13px;color:var(--c-text-2);white-space:nowrap;">📅 选择日期</label>
      <input type="date" value="${esc(state.selectedDate)}" onchange="state.selectedDate=this.value;render()" style="padding:6px 10px;border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface);color:var(--c-text);font-size:13px;">
      <button class="btn btn-secondary btn-sm" onclick="state.selectedDate='${isoOf(today)}';render()" style="white-space:nowrap;">回到今天</button>
    </div>

    <div class="weekly-overview" style="margin-bottom:20px;">
      <h3>📌 本周待办（按优先级）<span class="count">${allActive.length}项</span></h3>
      ${allActive.length > 0 ? allActive.map(t => t._isHabit ? renderHabitRow(t._kr) : renderTodoRow(t)).join('') : '<div class="empty-state" style="padding:20px;"><div class="es-text">🎉 本周无待办</div></div>'}
    </div>

    <div class="section-label" style="margin-bottom:8px;">📅 按天分布</div>
    ${dayGroups.map(g => {
      const gISO = isoOf(g.date);
      const isSelected = state.selectedDate === gISO;
      const isToday = sameDay(g.date, today);
      return `
      <div class="week-day ${g.todos.length === 0 ? 'empty' : ''} ${isSelected ? 'selected' : ''}">
        <div class="day-head">
          <span>${g.dayName}${isToday ? ' (今天)' : ''}${isSelected ? ' ⬅️ 已选' : ''}</span>
          <span>${g.date.getMonth()+1}.${g.date.getDate()}</span>
          <span class="day-count">${g.todos.length > 0 ? g.todos.length + '项' : '无待办'}</span>
        </div>
        <div class="day-todos">
          ${g.todos.length > 0 ? g.todos.map(t => t._isHabit ? renderHabitRow(t._kr) : renderTodoRow(t)).join('') : ''}
        </div>
      </div>
    `}).join('')}
  `;
  document.getElementById('page-weekly').innerHTML = html;
}

/* ===== AI Page (interactive) ===== */

        id: kr.id, type: 'kr', typeLabel: 'KR笔记',

  if (state.currentDomainId === 'all') {
    // show everything
  }

  // Filter by search query
  if (state.notesSearch) {
    const q = state.notesSearch.toLowerCase();
    filtered = filtered.filter(n =>
      n.content.toLowerCase().includes(q) ||
      n.sourceName.toLowerCase().includes(q) ||
      n.tags.some(t => t.toLowerCase().includes(q))

    filtered = filtered.filter(n => n.type === state.notesTypeFilter);

  // Sort: pinned first, then by createdAt desc
  filtered.sort((a, b) => {
    if (a.pinned !== b.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    return b.createdAt - a.createdAt;

  const pinnedCount = filtered.filter(n => n.pinned).length;

  const html = `

      </div>

    <div style="font-size:13px;color:var(--c-text-2);margin-bottom:16px;">

/* Local AI engine: parse natural language into a structured task */
function parseNLTask(text) {
  const result = { title: text, priority: 'P2', ddlDate: '', ddlText: '', domainId: null, krId: '', status: '进行中', nextStep: '', notes: '' };

  // Priority detection
  if (/P0|紧急且重要|非常紧急|十万火急|马上|立刻/i.test(text)) result.priority = 'P0';
  else if (/P1|重要|尽快|赶紧/i.test(text)) result.priority = 'P1';
  else if (/P3|不急|有空|闲着|以后|回头/i.test(text)) result.priority = 'P3';
  else result.priority = 'P2';

  // Deadline detection
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if (/(今天|今日)/.test(text)) { result.ddlText = '今天'; result.ddlDate = toISO(now); }
  else if (/明天/.test(text)) { const d = new Date(now); d.setDate(d.getDate()+1); result.ddlText = '明天'; result.ddlDate = toISO(d); }
  else if (/(本周末|这周末)/.test(text)) { const d = new Date(now); const day = d.getDay()||7; d.setDate(d.getDate()+(6-day)); result.ddlText = '本周末'; result.ddlDate = toISO(d); }
  else if (/(本周|这周)/.test(text)) { result.ddlText = '本周'; }
  else if (/下个?周/.test(text)) { result.ddlText = '下周'; }
  else if (/本月/.test(text)) { result.ddlText = '本月'; }
  else if (/下个月|下月/.test(text)) { result.ddlText = '下个月'; }
  else {
    const m = text.match(/(\d{1,2})[.\/-](\d{1,2})/);
    if (m) { result.ddlText = `${m[1]}.${m[2]}`; const d = new Date(now.getFullYear(), parseInt(m[1])-1, parseInt(m[2])); if (!isNaN(d)) result.ddlDate = toISO(d); }
  }

  // Domain detection by keyword map
  const domains = state.data.domains.filter(d => !d.hidden);
  const kwMap = [
    { name: '工作', kw: ['工作','项目','会议','周报','汇报','客户','需求','上线','交付','复盘','排期'] },
    { name: '学习成长', kw: ['学习','读书','阅读','课程','复习','考试','作业','笔记','书'] },
    { name: '生活健康', kw: ['健身','运动','跑步','睡觉','早起','买菜','做饭','家务','健康','作息','整理'] }
  ];
  let bestDomain = null;
  for (const d of domains) {
    if (text.includes(d.name)) { bestDomain = d.id; break; }
    const km = kwMap.find(k => k.name === d.name);
    if (km && km.kw.some(k => text.includes(k))) { bestDomain = d.id; break; }
  }
  if (!bestDomain && domains.length) bestDomain = domains[0].id;
  result.domainId = bestDomain;

  // KR detection within domain
  const krs = bestDomain ? getKRsByDomain(bestDomain) : [];
  for (const k of krs) {
    if (text.includes(k.name)) { result.krId = k.id; break; }
  }

  // Clean title: strip detected markers
  let title = text
    .replace(/P[0-3]/gi, '')
    .replace(/(今天|今日|明天|本周末|这周末|本周|这周|下个?周|本月|下个月|下月)/g, '')
    .replace(/(紧急且重要|非常紧急|十万火急|马上|立刻|重要|尽快|赶紧|不急|有空|闲着|以后|回头)/g, '')
    .replace(/[，,。、！!？?]+$/g, '')
    .replace(/^\s*[要需得应该该]+/g, '')
    .trim();
  result.title = title || text.trim();

  return result;
}

function generateWeeklyReportContent() {
  const todos = state.data.todos;
  const done = todos.filter(t => t.done);
  const active = todos.filter(t => !t.done);
  const total = todos.length;
  const rate = total ? Math.round(done.length / total * 100) : 0;
  const L = [];
  L.push(`📊 本周总结 (${dateStr(new Date())})`);
  L.push('');
  L.push('—— 数据概览 ——');
  L.push(`总任务: ${total} | 已完成: ${done.length} | 待完成: ${active.length}`);
  L.push(`完成率: ${rate}%`);
  L.push('');
  L.push('—— 领域分布 ——');
  state.data.domains.forEach(d => {
    const dt = todos.filter(t => t.domainId === d.id);
    const dd = dt.filter(t => t.done).length;
    if (dt.length) L.push(`${d.name}: ${dd}/${dt.length} 完成`);
  });
  L.push('');
  L.push('—— 待办优先级分布 ——');
  let hasP = false;
  ['P0','P1','P2','P3'].forEach(p => {
    const pt = active.filter(t => t.priority === p);
    if (pt.length) { hasP = true; L.push(`${p}: ${pt.length} 项`); }
  });
  if (!hasP) L.push('暂无待办');
  L.push('');
  L.push('—— 建议重点关注 ——');
  const p0 = active.filter(t => t.priority === 'P0');
  if (p0.length) {
    p0.slice(0, 3).forEach(t => { const ddl = formatDDL(t); L.push(`• ${t.title}${ddl ? ' (⏰' + ddl + ')' : ''}`); });
  } else {
    const p1 = active.filter(t => t.priority === 'P1');
    if (p1.length) p1.slice(0, 3).forEach(t => L.push(`• ${t.title}`));
    else L.push('暂无紧急任务，可推进重要不紧急事项 🎉');
  }
  L.push('');
  L.push('—— 习惯打卡 ——');
  state.data.krs.filter(k => k.type === 'habit').forEach(k => {
    L.push(`${k.name}: 连续 ${getStreak(k.id)} 天${isHabitCheckedToday(k.id) ? ' ✅ 今日已打卡' : ''}`);
  });
  return L.join('\n');
}

function sendAIMessage() {
  const input = document.getElementById('ai-input');
  const text = input ? input.value.trim() : '';
  if (!text) return;
  input.value = '';
  state.aiChat.push({ type: 'text', role: 'user', content: text });
  // typing indicator
  const typingId = uid();
  state.aiChat.push({ type: 'typing', id: typingId });
  renderAI();
  setTimeout(() => {
    state.aiChat = state.aiChat.filter(m => !(m.type === 'typing' && m.id === typingId));

    const hasKR = /KR/i.test(text);
    const hasDomain = /领域/.test(text);

    // KR creation: text contains "KR"
    if (hasKR) {
      let krName = text;
      let domainId = null;

      // Extract domain: "XXX领域" or "领域：XXX"
      const domBefore = krName.match(/([\u4e00-\u9fa5a-zA-Z0-9&]+)领域/);
      const domAfter = krName.match(/领域[:：\s]*([\u4e00-\u9fa5a-zA-Z0-9&]+)/);
      const domRef = (domBefore && domBefore[1]) || (domAfter && domAfter[1]);
      if (domRef) {
        const found = state.data.domains.find(d => d.name === domRef);
        if (found) domainId = found.id;
        krName = krName.replace(domBefore ? domBefore[0] : '', '').replace(domAfter ? domAfter[0] : '');
      }

      // Clean KR name: remove trigger words, "KR", "领域", colons, emojis
      krName = krName
        .replace(/新建|创建|新增|添加/g, '')
        .replace(/KR/gi, '')
        .replace(/领域/g, '')
        .replace(/属于/g, '')
        .replace(/[:：,，\s]/g, '')
        .replace(/[^\u4e00-\u9fa5a-zA-Z0-9&]/g, '')
        .trim();

      if (krName) {
        if (!domainId) domainId = state.data.domains.length > 0 ? state.data.domains[0].id : null;
        const krType = /习惯|每日|打卡|坚持/.test(text) ? 'habit' : 'project';
        const nkr = { id: uid(), domainId, name: krName, type: krType, progress: 0, target: 100, unit: '%' };
        state.data.krs.push(nkr);
        saveData();
        const dom = state.data.domains.find(d => d.id === domainId);
        state.aiChat.push({ type: 'kr_created', id: uid(), krId: nkr.id, name: krName, domainName: dom ? dom.name : '默认', krType });
        renderAI();
        return;
      }
    }

    // Domain creation: text contains "领域"
    if (hasDomain) {
      const name = text
        .replace(/新建|创建|新增|添加/g, '')
        .replace(/领域/g, '')
        .replace(/[:：\s,，]/g, '')
        .replace(/[^\u4e00-\u9fa5a-zA-Z0-9&]/g, '')
        .trim();
      if (name) {
        const nd = { id: uid(), name, color: '#6366f1', hidden: false };
        state.data.domains.push(nd);
        saveData();
        state.aiChat.push({ type: 'domain_created', id: uid(), domainId: nd.id, name });
        renderAI();
        return;
      }
    }

    if (text.includes('周报') || text.includes('总结') || text.includes('汇总') || text.includes('report')) {
      const report = generateWeeklyReportContent();
      state.aiChat.push({ type: 'report', content: report });
    } else {
      const parsed = parseNLTask(text);
      const msgId = uid();
      state.aiChat.push({ type: 'parsed', id: msgId, parsed });
    }
    renderAI();
  }, 600);
}

function generateReport() {
  if (state.view !== 'ai') switchView('ai');
  state.aiChat.push({ type: 'text', role: 'user', content: '生成本周周报' });
  const typingId = uid();
  state.aiChat.push({ type: 'typing', id: typingId });
  renderAI();
  setTimeout(() => {
