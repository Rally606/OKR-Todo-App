/* ===== Actions ===== */
let _dragTodoId = null;
let _dragDomainId = null;
let _dragKRId = null;

function onDragEndClean(e) {
  document.querySelectorAll('.dragging, .drag-over').forEach(r => r.classList.remove('dragging', 'drag-over'));
}
function onDragLeaveClean(e) {
  const el = e.target.closest('[draggable]');
  if (el) el.classList.remove('drag-over');
}

/* Domain drag */
function onDomainDragStart(e, id) {
  _dragDomainId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.target.closest('.domain-tab').classList.add('dragging');
}
function onDomainDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const el = e.target.closest('.domain-tab:not(.add)');
  if (el && _dragDomainId) el.classList.add('drag-over');
}
function onDomainDrop(e, targetId) {
  e.preventDefault();
  onDragLeaveClean(e);
  if (!_dragDomainId || _dragDomainId === targetId) return;
  const domains = state.data.domains;
  const fromIdx = domains.findIndex(d => d.id === _dragDomainId);
  const toIdx = domains.findIndex(d => d.id === targetId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = domains.splice(fromIdx, 1);
  domains.splice(toIdx, 0, moved);
  domains.forEach((d, i) => d.order = i);
  _dragDomainId = null;
  saveData();
  render();
}

/* KR drag */
function onKRDragStart(e, id) {
  _dragKRId = id;
  e.dataTransfer.effectAllowed = 'move';
  const el = e.target.closest('.kr-card, .kr-list-item');
  if (el) el.classList.add('dragging');
}
function onKRDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const el = e.target.closest('.kr-card, .kr-list-item');
  if (el && _dragKRId) el.classList.add('drag-over');
}
function onKRDrop(e, targetId) {
  e.preventDefault();
  onDragLeaveClean(e);
  if (!_dragKRId || _dragKRId === targetId) return;
  const krs = state.data.krs;
  const fromIdx = krs.findIndex(k => k.id === _dragKRId);
  const toIdx = krs.findIndex(k => k.id === targetId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = krs.splice(fromIdx, 1);
  krs.splice(toIdx, 0, moved);
  krs.forEach((k, i) => k.order = i);
  _dragKRId = null;
  saveData();
  render();
}

/* Todo drag */

}
function onTodoDragEnd(e) {

function onTodoDragLeave(e) {

function onTodoDrop(e, targetId) {
  e.preventDefault();

function exportData() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `okr-todo-backup-${dateStr(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON 数据已导出', 'success');
}

function exportCSV() {
  const headers = ['标题','优先级','状态','完成','截止日期','截止补充','领域','KR','备注/链接','下一步','创建时间'];
  const rows = state.data.todos.map(t => {
    const domain = getDomain(t.domainId);
    const kr = t.krId ? getKR(t.krId) : null;
    return [t.title, t.priority, t.status, t.done ? '是' : '否', t.ddlDate || '', t.ddlText || '', domain ? domain.name : '', kr ? kr.name : '', t.nextStep, t.notes, new Date(t.createdAt).toLocaleString('zh-CN')];
  });
  const csv = [headers, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `okr-todo-${dateStr(new Date())}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV 已导出（' + rows.length + ' 条任务）', 'success');
}

function csvCell(v) {
  const s = v == null ? '' : String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.domains || !data.krs) throw new Error('Invalid format');
      state.data = data;
      if (!state.data.checkins) state.data.checkins = {};
      if (!state.data.quickNotes) state.data.quickNotes = [];
      saveData(); render(); toast('数据导入成功', 'success');
    } catch(err) { toast('导入失败：文件格式错误', 'error'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAllData() {
  if (!confirm('确认清空所有数据？此操作不可恢复！')) return;
  if (!confirm('再次确认：所有领域、KR、Todo和笔记都将被删除！')) return;
  localStorage.removeItem(STORAGE_KEY);
  state.data = { domains: [], krs: [], todos: [], quickNotes: [], checkins: {} };
  state.currentDomainId = null;
  state.currentKRId = null;
  state.aiChat = [];
  initData();
  render(); toast('数据已重置为示例数据', 'info');
}

    priority: document.getElementById('kr-priority').value,
    status: document.getElementById('kr-status').value,
    goal: document.getElementById('kr-goal').value.trim(),
    ddlDate: document.getElementById('kr-ddldate').value.trim(),
    ddlText: document.getElementById('kr-ddltext').value.trim(),
    nextStep: document.getElementById('kr-nextstep').value.trim(),
    docLink: document.getElementById('kr-doclink').value.trim(),
    notes: document.getElementById('kr-notes').value.trim()
  };

  if (id) {
    const kr = getKR(id);
    Object.assign(kr, data);
  } else {
    state.data.krs.push({ id: uid(), ...data, progress: 0, checklist: [] });
    state.currentKRId = state.data.krs[state.data.krs.length - 1].id;
  }
  saveData(); closeModal(); render(); toast('已保存', 'success');
}

function openTodoModal(id, krId, preset) {
  const t = id ? state.data.todos.find(x => x.id === id) : null;
  const domains = state.data.domains.filter(d => !d.hidden);
  const krs = state.data.krs;
  const defaultDomain = t ? t.domainId : (preset ? preset.domainId : (krId ? (getKR(krId)?.domainId || state.currentDomainId) : state.currentDomainId));

  showModal(`
    <div class="modal-bar todo"></div>
    <div class="modal-head">
      <h3>📋 ${t ? '编辑 Todo' : '新建 Todo'}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>任务标题</label>
        <input type="text" id="td-title" value="${t ? esc(t.title) : (preset ? esc(preset.title) : '')}" placeholder="如：撰写项目周报" autofocus>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>所属领域</label>
          <select id="td-domain" onchange="updateKROptions()">
            ${domains.map(d => `<option value="${d.id}" ${defaultDomain === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>所属 KR（选填）</label>
          <select id="td-kr">
            <option value="">无（独立Todo）</option>
            ${krs.map(k => `<option value="${k.id}" ${t && t.krId === k.id ? 'selected' : (preset && preset.krId === k.id ? 'selected' : (krId === k.id ? 'selected' : ''))}>${esc(k.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>优先级</label>
          <select id="td-priority">
            ${['P0','P1','P2','P3'].map(p => `<option value="${p}" ${t && t.priority === p ? 'selected' : (preset && preset.priority === p ? 'selected' : (p === 'P2' ? 'selected' : ''))}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>状态</label>
          <select id="td-status">
            ${['进行中','待开始','已归档','hold'].map(s => `<option value="${s}" ${t && t.status === s ? 'selected' : (preset && preset.status === s ? 'selected' : (s === '进行中' ? 'selected' : ''))}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>截止日期（选填）</label>
          <div style="display:flex;align-items:center;gap:6px;">
            <input type="date" id="td-ddldate" value="${t ? esc(t.ddlDate || '') : (preset ? esc(preset.ddlDate || '') : '')}" style="flex:1;">
            ${(t && t.ddlDate) ? '<button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById(\'td-ddldate\').value=\'\'" title="清除日期">✕</button>' : ''}
          </div>
        </div>
        <div class="form-group">
          <label>截止时间补充</label>
          <input type="text" id="td-ddl" value="${t ? esc(t.ddlText) : (preset ? esc(preset.ddlText) : '')}" placeholder="如：9.25-10.7 / 本周末 / 下周">
        </div>
      </div>
      <div class="form-group">
        <label>下一步</label>
        <textarea id="td-nextstep" rows="2" placeholder="下一步行动计划...">${t ? esc(t.nextStep) : (preset ? esc(preset.nextStep) : '')}</textarea>
      </div>
      <div class="form-group">
        <label>文档</label>
        <textarea id="td-doclink" rows="2" placeholder="文档链接，可点击打开">${t ? esc(t.docLink || '') : (preset ? esc(preset.docLink || '') : '')}</textarea>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="td-notes" rows="2" placeholder="补充说明">${t ? esc(t.notes) : (preset ? esc(preset.notes) : '')}</textarea>
      </div>
      <div class="form-group">
        <label>笔记区</label>
        <textarea id="td-knowledge" rows="4" placeholder="做完后沉淀的知识、攻略、踩坑记录...">${t ? esc(t.knowledge || '') : (preset ? esc(preset.knowledge || '') : '')}</textarea>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="td-showHome" ${(!t || t.showHome !== false) ? 'checked' : ''} style="width:auto;margin:0;">
          <span>在首页展示</span>
        </label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTodo('${id || ''}')">保存</button>
    </div>
  `);
  setTimeout(() => document.getElementById('td-title')?.focus(), 100);
}

function updateKROptions() {
  const domainId = document.getElementById('td-domain').value;
  const krSelect = document.getElementById('td-kr');
  const currentVal = krSelect.value;
  const krs = getKRsByDomain(domainId);
  krSelect.innerHTML = '<option value="">无（独立Todo）</option>' + krs.map(k => `<option value="${k.id}" ${currentVal === k.id ? 'selected' : ''}>${esc(k.name)}</option>`).join('');
}

function saveTodo(id) {
  const title = document.getElementById('td-title').value.trim();
  if (!title) { toast('请输入任务标题', 'error'); return; }

  const data = {
    title,
    domainId: document.getElementById('td-domain').value,
    krId: document.getElementById('td-kr').value,
    priority: document.getElementById('td-priority').value,
    status: document.getElementById('td-status').value,
    ddlDate: document.getElementById('td-ddldate').value.trim(),
    ddlText: document.getElementById('td-ddl').value.trim(),
    nextStep: document.getElementById('td-nextstep').value.trim(),
    docLink: document.getElementById('td-doclink').value.trim(),
    notes: document.getElementById('td-notes').value.trim(),
    knowledge: document.getElementById('td-knowledge').value.trim(),
    showHome: document.getElementById('td-showHome').checked
  };

  if (id) {
    const t = state.data.todos.find(x => x.id === id);
    Object.assign(t, data);
  } else {
    state.data.todos.push({ id: uid(), ...data, ddl: '', done: false, createdAt: Date.now() });
  }
  saveData(); closeModal(); render(); toast('已保存', 'success');
}

function openKRDetailed(krId) {
  state.currentKRId = krId;
  switchView('krs');
}

/* ===== Sidebar (mobile) ===== */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('mobile-backdrop').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobile-backdrop').classList.remove('show');
}

/* ===== Keyboard Shortcuts ===== */
function isTextInput(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}

let _keyCaptureAction = null;

function getShortcutKey(action) {
  return state.prefs.shortcuts[action] || DEFAULT_SHORTCUTS[action];
}

function findShortcutConflict(key, excludeAction) {
  if (key >= '1' && key <= '6') return 'pageNavigation';
  if (key === 'Escape') return 'escape';
  for (const [action, k] of Object.entries(state.prefs.shortcuts)) {
    if (action !== excludeAction && k === key) return action;
  }
  return null;
}

function startKeyCapture(action) {
  _keyCaptureAction = action;
  document.querySelectorAll('.sc-capture-btn').forEach(btn => {
    btn.textContent = btn.dataset.action === action ? '按下新键...' : '修改';
    if (btn.dataset.action === action) {
      btn.classList.add('capturing');
      btn.textContent = '按下新键...';
    } else {
      btn.classList.remove('capturing');
    }
  });
}

function resetShortcuts() {
  state.prefs.shortcuts = { ...DEFAULT_SHORTCUTS };
  savePrefs();
  if (state.view === 'settings') render();
  if (document.getElementById('modal-container').innerHTML.trim()) showShortcutsModal();
  toast('已恢复默认快捷键', 'success');
}

document.addEventListener('keydown', (e) => {
  // Key capture mode for rebinding
  if (_keyCaptureAction) {
    e.preventDefault();
    e.stopPropagation();
    const key = e.key;
    if (key === 'Escape') {
      _keyCaptureAction = null;
      if (document.getElementById('modal-container').innerHTML.trim()) showShortcutsModal();
      else if (state.view === 'settings') render();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) {
      toast('不支持组合键，请按单个字母或符号键', 'info');
      return;
    }
    const conflict = findShortcutConflict(key, _keyCaptureAction);
    if (conflict) {
      const label = SHORTCUT_LABELS[conflict] || (conflict === 'pageNavigation' ? '页面切换(1~6)' : conflict);
      toast(`按键 "${key}" 已被「${label}」占用`, 'error');
      return;
    }
    state.prefs.shortcuts[_keyCaptureAction] = key;
    savePrefs();
    _keyCaptureAction = null;
    toast(`快捷键已更新`, 'success');
    if (document.getElementById('modal-container').innerHTML.trim()) showShortcutsModal();
    else if (state.view === 'settings') render();
    return;
  }

  // Esc always closes modal first
  if (e.key === 'Escape') {
    const modal = document.getElementById('modal-container');
    if (modal.innerHTML.trim()) { closeModal(); return; }
    if (document.getElementById('sidebar').classList.contains('open')) { closeSidebar(); return; }
    return;
  }
  // If typing in a text field, ignore the rest
  if (isTextInput(e.target)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const views = ['dashboard','krs','tasks','weekly','ai','settings'];
  if (e.key >= '1' && e.key <= '6') {
    e.preventDefault();
    switchView(views[parseInt(e.key) - 1]);
    return;
  }

  const k = e.key.toLowerCase();
  const sc = state.prefs.shortcuts;

  if (k === sc.showHelp || e.key === sc.showHelp) {
    e.preventDefault();
    showShortcutsModal();
    return;
  }
  if (e.key === sc.searchFocus) {
    e.preventDefault();
    if (state.view !== 'tasks') { switchView('tasks'); setTimeout(() => document.getElementById('task-search')?.focus(), 50); }
    else document.getElementById('task-search')?.focus();
    return;
  }
  if (k === sc.newTodo) { e.preventDefault(); openTodoModal(null); return; }
  if (k === sc.toggleTheme) { e.preventDefault(); toggleTheme(); return; }
  if (k === sc.quadrantToggle) {
    e.preventDefault();
    if (state.view !== 'tasks') switchView('tasks');
    else { state.taskView = state.taskView === 'list' ? 'quadrant' : 'list'; render(); }
    return;
  }
  if (k === sc.generateReport) { e.preventDefault(); generateReport(); return; }
});

function renderShortcutRow(action) {
  const key = getShortcutKey(action);
  const display = key.length === 1 ? key.toUpperCase() : key;
  const capturing = _keyCaptureAction === action;
  return `<div class="sc-row">
    <span class="sc-desc">${SHORTCUT_LABELS[action]}</span>
    <span style="display:flex;align-items:center;gap:8px;">
      <kbd>${esc(display)}</kbd>
      <button class="sc-capture-btn btn btn-secondary btn-sm" data-action="${action}" onclick="startKeyCapture('${action}')">${capturing ? '按下新键...' : '修改'}</button>
    </span>
  </div>`;
}

function showShortcutsModal() {
  const customizableActions = ['newTodo','searchFocus','toggleTheme','quadrantToggle','generateReport','showHelp'];
  showModal(`
    <div class="modal-head">
      <h3>⌨️ 键盘快捷键</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="shortcut-list">
        <div class="sc-row"><span class="sc-desc">切换页面（首页→设置）</span><span><kbd>1</kbd> ~ <kbd>6</kbd></span></div>
        ${customizableActions.map(a => renderShortcutRow(a)).join('')}
        <div class="sc-row"><span class="sc-desc">关闭弹窗/侧边栏</span><kbd>Esc</kbd></div>
      </div>
      <div style="margin-top:14px;font-size:12px;color:var(--c-text-3);">点击「修改」后按下新键即可重新绑定。Esc 可取消。1~6 和 Esc 固定不可改。</div>
    </div>
    <div class="modal-foot" style="display:flex;gap:8px;">
      <button class="btn btn-secondary btn-sm" onclick="resetShortcuts()">恢复默认</button>
      <button class="btn btn-primary" onclick="closeModal()">知道了</button>
    </div>
  `);
}

/* ===== Toast ===== */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2000);
}

/* ===== Init ===== */
function init() {
  loadPrefs();
  // first visit: respect system preference
  if (!localStorage.getItem(PREFS_KEY)) {
    state.prefs.theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  applyTheme();
  loadData();
  if (state.data.domains.length === 0) initData();
  render();
}
init();
</script>
